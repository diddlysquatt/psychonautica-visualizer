# Builds the visualizer and the scene gallery and publishes them with GitHub Pages.
#   site root            the visualizer (index.html) and a downloadable copy (psychonautica-visualizer.html)
#   gallery/             the scene gallery and gallery/packs/<key>.scene.js
#   scenes/<key>/        thumbnails
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the visualizer
        run: |
          python tools/build.py . _site/index.html
          cp _site/index.html _site/psychonautica-visualizer.html
      - name: Build the gallery
        run: |
          python tools/gallery.py --out _site/gallery --visualizer ../ --scenes-url ../scenes
          for d in scenes/*/; do
            k=$(basename "$d")
            if [ -f "$d/thumb.jpg" ]; then mkdir -p "_site/scenes/$k"; cp "$d/thumb.jpg" "_site/scenes/$k/thumb.jpg"; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
