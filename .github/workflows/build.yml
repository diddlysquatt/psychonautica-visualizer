# On every pull request: the visualizer must build, with both builders, to the same bytes.
# (It does not run contributed scene code. A maintainer runs tools/check-scene.mjs during review.)
name: Build
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/build.py . out/py.html
      - run: node tools/build.mjs . out/node.html
      - run: cmp out/py.html out/node.html
      - run: python tools/gallery.py --out out/gallery
